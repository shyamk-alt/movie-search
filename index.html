<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieFlix - 10,000 Movies</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#141414;color:#fff;font-family:Arial}header{background:#000;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99}header h1{color:#e50914}input{padding:10px 20px;width:60%;border-radius:25px;border:none;outline:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px;padding:20px 5%}.card{cursor:pointer;transition:.3s;background:#222;border-radius:8px;overflow:hidden}.card:hover{transform:scale(1.05)}.card img{width:100%;height:220px;object-fit:cover}.card h3{padding:8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:999;align-items:center;justify-content:center}.modal.active{display:flex}.box{background:#181818;padding:20px;border-radius:10px;width:90%;max-width:800px;max-height:90vh;overflow:auto}iframe{width:100%;height:350px;border:none;margin:10px 0}button{background:#e50914;color:#fff;border:none;padding:8px 18px;border-radius:20px;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<header>
<h1>🎬 MovieFlix</h1>
<input id="search" placeholder="Search Avengers, Ben 10, Stranger Things, RRR...">
</header>
<div id="movies" class="grid"></div>
<div id="modal" class="modal" onclick="this.classList.remove('active')">
<div class="box" onclick="event.stopPropagation()">
<h2 id="mTitle"></h2>
<p id="mDesc"></p>
<iframe id="trailer"></iframe>
<button onclick="modal.classList.remove('active')">Close</button>
</div>
</div>
<script>
const API_KEY='cf50784147689016264077d7f18a3dbc';
const IMG='https://image.tmdb.org/t/p/w500';
const moviesEl=document.getElementById('movies');
async function searchMovies(q){
 let url=q?`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${q}`:`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}`;
 let res=await fetch(url); let data=await res.json();
 showMovies(data.results);
}
function showMovies(list){
 moviesEl.innerHTML='';
 list.forEach(m=>{
  if(!m.poster_path) return;
  moviesEl.innerHTML+=`<div class="card" onclick="openMovie(${m.id})"><img src="${IMG+m.poster_path}"><h3>${m.title}</h3></div>`;
 });
}
async function openMovie(id){
 let res=await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${API_KEY}&append_to_response=videos`);
 let m=await res.json();
 document.getElementById('mTitle').innerText=m.title;
 document.getElementById('mDesc').innerText=m.overview;
 let vid=m.videos.results.find(v=>v.type==='Trailer')||m.videos.results[0];
 document.getElementById('trailer').src=vid?`https://www.youtube.com/embed/${vid.key}`:'';
 document.getElementById('modal').classList.add('active');
}
document.getElementById('search').addEventListener('input',e=>searchMovies(e.target.value));
searchMovies('');
</script>
</body>
</html>
